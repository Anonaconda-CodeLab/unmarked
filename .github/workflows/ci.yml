name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Check dist/ is up to date (every file the website serves)
        run: |
          git diff --exit-code -- dist/ || { echo "::error::Run 'npm run build' and commit dist/"; exit 1; }
          if [ -n "$(git ls-files --others --exclude-standard -- dist/)" ]; then git ls-files --others --exclude-standard -- dist/; echo "::error::Run 'npm run build' and commit the new files in dist/"; exit 1; fi
